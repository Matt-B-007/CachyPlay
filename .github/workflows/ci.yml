name: CI

# Runs on every push to main (and on pull requests). Two rows per release in the Actions tab:
#   CI       on main     tests; if they pass and the version in Cargo.toml has no release yet,
#                        tags the commit vX.Y.Z[-beta.N] and starts the Release workflow.
#   Release  on the tag  builds and publishes (see release.yml).
# To release: bump `version` in Cargo.toml and push. Pushing without a bump only runs the tests.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install GUI build dependencies (Tauri / WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Tests in another time zone (times must not depend on where the PC is)
        run: TZ=Asia/Tokyo cargo test --workspace --locked
      - name: Check dependencies for known security problems
        run: |
          cargo install cargo-audit --locked --quiet
          cargo audit
      - run: sh -n install.sh && sh -n scripts/version-guard.sh

  # The same tests on an Arch-based system, closer to CachyOS than Ubuntu.
  arch:
    name: Tests (Arch)
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust webkit2gtk-4.1 librsvg openssl xdotool
      - uses: actions/checkout@v7
      - name: Test as a normal user (some tests check file permissions)
        run: |
          useradd -m builder
          chown -R builder .
          su builder -c "cargo test --workspace --locked"

  # All tests passed on main: tag a new version and hand it to the Release workflow.
  tag:
    name: Tag new version
    needs: [test, arch]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag and start the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tag="v$ver"
          if gh api "repos/${{ github.repository }}/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists (released, or its Release run started from the tag). Nothing to do."
            exit 0
          fi
          gh release list --limit 200 --json tagName --jq '.[].tagName' | sh scripts/version-guard.sh "$ver"
          grep -q "\"$ver\"" Cargo.lock || { echo "Cargo.lock is out of date: run cargo update --workspace and push again."; exit 1; }
          gh api "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/$tag" -f sha="${{ github.sha }}" >/dev/null
          gh workflow run release.yml --ref "$tag" -f title="${{ github.event.head_commit.message }}" -f tested=true
          echo "Tagged $tag; the Release run is starting."
