# Dependency updates, bundled: once a month, at most one pull request for Rust libraries and one
# for GitHub Actions, instead of one per library. Security fixes still arrive right away.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "Monthly Rust library updates"
    groups:
      rust-libraries:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "Monthly workflow updates"
    groups:
      workflow-actions:
        patterns: ["*"]
