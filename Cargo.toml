[workspace]
resolver = "2"
members = ["crates/cachyplay-core", "crates/cachyplay", "crates/cachyplay-gui"]

[workspace.package]
version = "0.1.0-beta.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/Matt-B-007/CachyPlay"
rust-version = "1.90"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind" # the wrapper relies on catch_unwind to fail open
