# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

# Runs on every push to main (and on pull requests). Two rows per release in the Actions tab:
#   CI       on main     tests; if they pass and the version in Cargo.toml has no release yet,
#                        tags the commit vX.Y.Z[-beta.N] and starts the Release workflow.
#   Release  on the tag  builds and publishes (see release.yml).
# To release: bump `version` in Cargo.toml and push. Pushing without a bump only runs the tests.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install GUI build dependencies (Tauri / WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
      - name: Install Rust (the version pinned in rust-toolchain.toml, with clippy and rustfmt)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install check tools (shellcheck 0.11.0, cargo-audit, cargo-deny)
        run: |
          pipx install shellcheck-py==0.11.0.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          cargo install cargo-audit --locked --quiet
          cargo install cargo-deny --locked --quiet
      # Everything is checked by one script, the same one used before every release, so the checks
      # here and on the PC can't differ: shell scripts, formatting, clippy, tests (also in Tokyo
      # time), cargo audit, release build + quick self-test.
      - name: Run scripts/check.sh (shell scripts, licence lines, fmt, clippy, tests, licences, audit, release self-test)
        run: sh scripts/check.sh

  # The same tests on an Arch-based system, closer to CachyOS than Ubuntu (Arch's own Rust package;
  # rust-toolchain.toml only applies where rustup is used).
  arch:
    name: Tests (Arch)
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust webkit2gtk-4.1 librsvg openssl xdotool
      - uses: actions/checkout@v7
      - name: Run scripts/check.sh tests as a normal user (some tests check file permissions)
        run: |
          useradd -m builder
          chown -R builder .
          su builder -c "sh scripts/check.sh tests"

  # All tests passed on main: tag a new version and hand it to the Release workflow.
  tag:
    name: Tag new version
    needs: [test, arch]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag and start the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tag="v$ver"
          if gh api "repos/${{ github.repository }}/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists (released, or its Release run started from the tag). Nothing to do."
            exit 0
          fi
          gh release list --limit 200 --json tagName --jq '.[].tagName' | sh scripts/version-guard.sh "$ver"
          grep -q "\"$ver\"" Cargo.lock || { echo "Cargo.lock is out of date: run cargo update --workspace and push again."; exit 1; }
          gh api "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/$tag" -f sha="${{ github.sha }}" >/dev/null
          gh workflow run release.yml --ref "$tag" -f title="${{ github.event.head_commit.message }}" -f tested=true
          echo "Tagged $tag; the Release run is starting."
