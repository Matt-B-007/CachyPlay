[package]
name = "cachyplay"
description = "One-click Linux game tuning, crash recovery and bug reports for CachyOS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "cachyplay"
path = "src/main.rs"

[dependencies]
cachyplay-core = { path = "../cachyplay-core" }
anyhow.workspace = true
clap.workspace = true

[dev-dependencies]
tempfile.workspace = true
cachyplay-core = { path = "../cachyplay-core", features = ["testutil"] }
