[workspace]
resolver = "2"
members = ["crates/cachyplay-core", "crates/cachyplay", "crates/cachyplay-gui"]

[workspace.package]
version = "0.1.0-beta.21"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/Matt-B-007/CachyPlay"
rust-version = "1.90"

[workspace.dependencies]
anyhow = "1"
jiff = { version = "1", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind" # the wrapper relies on catch_unwind to fail open
