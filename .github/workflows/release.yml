name: Release
run-name: ${{ inputs.title || github.event.head_commit.message || github.ref_name }}

# Builds and publishes a release for a version tag (vX.Y.Z or vX.Y.Z-beta.N), as a pre-release
# when it contains "-beta.". Normally started by CI after all tests pass on main; also runs if
# a tag is pushed by hand (then it runs the tests itself first).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      title:
        description: Name shown in the Actions list
        required: false
      tested:
        description: CI already ran the tests on this commit
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          ver=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "$tag" = "v$ver" ] || { echo "Tag $tag doesn't match version $ver in Cargo.toml."; exit 1; }
          assets=$(gh release view "$tag" --json assets --jq '[.assets[].name | select(endswith(".tar.zst"))] | length' 2>/dev/null || echo 0)
          if [ "$assets" -gt 0 ]; then
            echo "$tag is already released."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install GUI build dependencies (Tauri / WebKitGTK)
        if: steps.ver.outputs.go == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        if: steps.ver.outputs.go == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.ver.outputs.go == 'true'

      - name: Tests (only for a tag pushed by hand; CI already tested otherwise)
        if: steps.ver.outputs.go == 'true' && inputs.tested != 'true'
        run: |
          cargo test --workspace --locked
          TZ=Asia/Tokyo cargo test --workspace --locked

      # Generic x86-64: no target-cpu=native, so it runs on every CachyOS/Arch machine.
      - name: Build
        if: steps.ver.outputs.go == 'true'
        run: |
          cargo build --workspace --release --locked
          got=$(./target/release/cachyplay --version)
          [ "$got" = "cachyplay ${{ steps.ver.outputs.version }}" ] || { echo "The build reports '$got'"; exit 1; }

      - name: Package
        if: steps.ver.outputs.go == 'true'
        run: |
          name="cachyplay-${{ steps.ver.outputs.tag }}-x86_64-linux"
          mkdir -p "dist/$name"
          cp target/release/cachyplay target/release/cachyplay-gui install.sh README.md LICENSE CHANGELOG.md "dist/$name/"
          cp assets/cachyplay.svg "dist/$name/"
          (cd dist && tar --zstd -cf "$name.tar.zst" "$name" && sha256sum "$name.tar.zst" > SHA256SUMS.txt)
          cp install.sh dist/install.sh

      - name: Sign the checksums (if a signing key is set up; see RELEASING.md)
        if: steps.ver.outputs.go == 'true'
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        run: |
          if [ -n "$MINISIGN_KEY" ]; then
            sudo apt-get install -y minisign
            printf '%s\n' "$MINISIGN_KEY" > /tmp/minisign.key
            minisign -S -s /tmp/minisign.key -m dist/SHA256SUMS.txt -t "CachyPlay ${{ steps.ver.outputs.tag }}"
            rm -f /tmp/minisign.key
          else
            echo "No MINISIGN_KEY secret: release is checksummed but not signed."
          fi

      - name: Release notes from CHANGELOG
        if: steps.ver.outputs.go == 'true'
        run: |
          ver="${{ steps.ver.outputs.version }}"; base="${ver%%-*}"
          awk -v v="$base" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "CachyPlay $ver" > notes.md

      - uses: softprops/action-gh-release@v3
        if: steps.ver.outputs.go == 'true'
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: CachyPlay ${{ steps.ver.outputs.tag }}
          body_path: notes.md
          prerelease: ${{ contains(steps.ver.outputs.version, '-beta.') }}
          make_latest: ${{ !contains(steps.ver.outputs.version, '-') }}
          fail_on_unmatched_files: false
          files: |
            dist/*.tar.zst
            dist/SHA256SUMS.txt
            dist/SHA256SUMS.txt.minisig
            dist/install.sh
